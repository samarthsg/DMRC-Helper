# Server
server.port=8080

# SQLite Database
spring.datasource.url=jdbc:sqlite:dmrc_helper.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# Set JWT_SECRET environment variable in production (min 32 chars).
# The default below is for local development only and must NOT be used in production.
jwt.secret=${JWT_SECRET:dmrc-helper-jwt-secret-key-change-in-production-2024}
# Access token: 15 minutes
jwt.expiration-ms=900000
# Refresh token: 7 days
jwt.refresh-expiration-ms=604800000

# CORS
# Restrict to your app's domain in production (e.g., https://yourapp.example.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.dmrc.helper=INFO
logging.level.org.springframework.security=WARN
